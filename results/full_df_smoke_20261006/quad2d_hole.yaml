profile: paper_fair
df:
  mode: full_df
# Paper VII-A dynamics profile; RRT* search settings retained, not a FLASK reproduction.
system: quad2d
environment: hole
dynobench:
  # Relative to this YAML. tools/run_six.py writes an absolute source path.
  source: "D:/codex_talk/project_1/project_code/dynobench-main/dynobench-main"
  environment_file: quad2d_v0/fall_through.yaml
lifting:
  start: {acceleration: [0, 0], jerk: [0, 0]}
  goal: {acceleration: [0, 0], jerk: [0, 0]}
df_limits: {max_acceleration: .inf, max_angular_acceleration: .inf}
sampling:
  guidance_probability: 0
planner:
  timeout: 3.0
  goal_bias: 0.15
  range: 1.0
  rewire_factor: 3.0
  goal_tolerance: 0.000001
  max_iterations: 100000
  max_nodes: 20000
  prune: false
  stop_at_first_solution: false
  rewire_before_first_solution: false
  explicit_goal_connection: true
  goal_parent_limit: 16
  cache_goal_connections: true
  minimum_parent_candidates: 8
  terminal_velocity_hint: false
pff:
  R_diagonal: [1, 1]
  free_terminal_state: true
  free_terminal_time: true
  min_time: 0.1
  max_time: 6.0
  fixed_time: 2.0
  additional_time_samples: 12
  defer_trajectories: true
simd:
  pff: true
  nearest_neighbor: true
geometry:
  robot_radius: 0.1
  obstacle_sphere_cell: 0.1
  collision_margin: 0.00001
validation:
  max_step: 0.005
  max_samples: 20000
  endpoint_tolerance: 0.001
benchmark:
  runs: 1
  seed: 41
  output_directory: "D:/codex_talk/project_1/project_code/RRTstarDFPFF_paper_r2_noguidance_20261006/results/full_df_smoke_20261006/quad2d_hole"
